<!DOCTYPE html>
<html>
<head>
<title>Donate Food</title>
</head>
<body>
<h2>Food Donation Form</h2>
<form action="/submit_donation" method="POST">
<input
type="text"
name="name"
placeholder="Donor Name"
required>
<br><br>
<input
type="text"
name="food_type"
placeholder="Food Type"
required>
<br><br>
<input
type="number"
name="quantity"
placeholder="Quantity"
required>
<br><br>
<input
type="date"
name="expiry"
required>
<br><br>
<button type="submit">
Submit Donation
</button>
</form>
</body>
</html>
