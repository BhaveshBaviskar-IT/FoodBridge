<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>FoodBridge | Food Rescue Mission</title> 
 
<link rel="stylesheet" href="/static/style.css"> 
 
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
 
<style> 
 
.mission-header{ 
    text-align:center; 
    margin-bottom:30px; 
} 
 
.mission-title{ 
    font-size:42px; 
    font-weight:bold; 
    background:linear-gradient(90deg, #00e676, #00b0ff); 
    -webkit-background-clip:text; 
    -webkit-text-fill-color:transparent; 
} 
 
.mission-subtitle{ 
    margin-top:10px; 
    opacity:.85; 
} 
 
.mission-stats{ 
    display:grid; 
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); 
    gap:15px; 
    margin-bottom:30px; 
} 
 
.mission-box{ 
    background:rgba(255,255,255,.1); 
    backdrop-filter:blur(15px); 
    border-radius:15px; 
    padding:20px; 
    text-align:center; 
} 
 
.mission-box h2{ 
    color:#00e676; 
} 
 
.form-grid{ 
    display:grid; 
    grid-template-columns:1fr 1fr; 
    gap:15px; 
} 
 
textarea{ 
    min-height:120px; 
    resize:none; 
} 
 
.upload-box{ 
    margin-top:15px; 
    padding:25px; 
    border:2px dashed rgba(255,255,255,.3); 
    border-radius:15px; 
    text-align:center; 
    cursor:pointer; 
    transition:all 0.3s ease; 
} 
 
.upload-box:hover{ 
    border-color:#00e676; 
    background:rgba(0,230,118,0.1); 
} 
 
.upload-box.uploaded{ 
    border-color:#00e676; 
    background:rgba(0,230,118,0.15); 
}
 
.upload-preview {
    margin-top: 15px;
    display: none;
}
 
.upload-preview img {
    max-width: 100%;
    max-height: 200px;
    border-radius: 10px;
    object-fit: cover;
    border: 2px solid #00e676;
}
 
.upload-preview.show {
    display: block;
}
 
.upload-status { 
    margin-top: 10px; 
    font-size: 14px; 
    color: #00e676; 
    display: none; 
} 
 
.upload-status.show { 
    display: block; 
} 
 
.submit-btn{ 
    background:linear-gradient(90deg, #00e676, #2962ff); 
    font-weight:bold; 
    letter-spacing:1px; 
} 
 
.submit-btn:hover{ 
    transform:translateY(-3px) scale(1.01); 
} 
 
.submit-btn:disabled { 
    opacity:0.6; 
    cursor:not-allowed; 
} 
 
.reward-card{ 
    margin-top:25px; 
    background:rgba(255,255,255,.08); 
    border-radius:15px; 
    padding:20px; 
    text-align:center; 
} 
 
.reward-card h3{ 
    color:#ffd700; 
} 
 
.error-message { 
    color: #ff6b6b; 
    margin-top: 10px; 
    display: none; 
    font-size: 14px; 
} 
 
.error-message.show { 
    display: block; 
} 
 
</style> 
 
</head> 
<body> 
 
<div class="glass-card glow"> 
 
    <div class="mission-header"> 
        <div style="font-size:70px;">🚀</div> 
        <div class="mission-title">FOOD RESCUE MISSION</div> 
        <div class="mission-subtitle">Transform surplus food into hope.</div> 
    </div> 
 
    <div class="mission-stats"> 
        <div class="mission-box"><h2>12,483</h2>Meals Saved</div> 
        <div class="mission-box"><h2>247</h2>Active Deliveries</div> 
        <div class="mission-box"><h2>128</h2>NGOs</div> 
        <div class="mission-box"><h2>98%</h2>Success Rate</div> 
    </div> 
 
    <form id="donationForm" method="POST"> 
 
        <div class="form-grid"> 
            <input type="text" name="name" id="donorName" placeholder="👤 Donor Name" required> 
            <input type="text" name="food_type" id="foodType" placeholder="🍱 Food Type" required> 
            <input type="number" name="quantity" id="quantity" placeholder="📦 Quantity" required> 
            <input type="date" name="expiry" id="expiry" required> 
        </div> 
 
        <textarea id="notes" name="notes" placeholder="📝 Additional Notes (optional)"></textarea> 
 
        <div class="upload-box" id="uploadBox"> 
            📸 Upload Food Image
            <br><br> 
            <input type="file" id="imageInput" accept="image/*" style="display:none;">
            <button type="button" id="uploadButton" class="btn">Choose Image</button>
            
            <div class="upload-preview" id="uploadPreview">
                <img id="previewImg" src="" alt="Food preview">
            </div>
 
            <div class="upload-status" id="uploadStatus">
                ✓ Image uploaded successfully to Cloudinary
            </div>
 
            <div class="error-message" id="errorMessage"></div>
        </div> 
 
        <!-- Hidden field storing the Cloudinary URL -->
        <input type="hidden" id="imageUrl" name="image_url" value="">
 
        <button class="submit-btn" id="submitBtn" type="submit"> 
            🚚 DEPLOY DONATION 
        </button> 
 
    </form> 
 
    <div class="reward-card"> 
        <h3>🏆 Impact Achievement</h3> 
        Every donation increases your FoodBridge Impact Score. 
    </div> 
 
</div> 
 
<script>
// ─── Cloudinary Config ───────────────────────────────────────────────
const CLOUDINARY_CLOUD_NAME = "dbqrq1dbl";       // your cloud name
const CLOUDINARY_UPLOAD_PRESET = "food bridge";   // your unsigned preset
// ─────────────────────────────────────────────────────────────────────
 
let uploadedImageUrl = "";
 
// Open file picker when button clicked
document.getElementById('uploadButton').addEventListener('click', function(e) {
    e.preventDefault();
    document.getElementById('imageInput').click();
});
 
// Handle file selection
document.getElementById('imageInput').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;
 
    clearError();
 
    if (!file.type.startsWith('image/')) {
        showError('Please upload a valid image file');
        return;
    }
 
    if (file.size > 5 * 1024 * 1024) {
        showError('Image size must be less than 5MB');
        return;
    }
 
    // Show local preview immediately
    const reader = new FileReader();
    reader.onload = function(ev) {
        document.getElementById('previewImg').src = ev.target.result;
        document.getElementById('uploadPreview').classList.add('show');
    };
    reader.readAsDataURL(file);
 
    await uploadToCloudinary(file);
});
 
// Upload to Cloudinary and store the returned URL
async function uploadToCloudinary(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
 
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = '📤 Uploading image...';
 
    try {
        // ✅ Fixed: use template literal correctly with CLOUDINARY_CLOUD_NAME
        const response = await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
            { method: 'POST', body: formData }
        );
 
        if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error?.message || 'Cloudinary upload failed');
        }
 
        const data = await response.json();
        uploadedImageUrl = data.secure_url;
 
        // Store URL in hidden field — this gets sent to Flask → Firestore
        document.getElementById('imageUrl').value = uploadedImageUrl;
 
        document.getElementById('uploadBox').classList.add('uploaded');
        document.getElementById('uploadStatus').classList.add('show');
 
    } catch (error) {
        console.error('Cloudinary upload error:', error);
        showError('Failed to upload image: ' + error.message);
        document.getElementById('uploadPreview').classList.remove('show');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '🚚 DEPLOY DONATION';
    }
}
 
// Submit form → Flask → Firestore (including Cloudinary image_url)
document.getElementById('donationForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    clearError();
 
    const formData = {
        donor_name: document.getElementById('donorName').value.trim(),
        food_type:  document.getElementById('foodType').value.trim(),
        quantity:   document.getElementById('quantity').value,
        expiry:     document.getElementById('expiry').value,
        notes:      document.getElementById('notes').value.trim(),
        image_url:  document.getElementById('imageUrl').value   // Cloudinary URL
    };
 
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ Submitting...';
 
    try {
        const response = await fetch('/submit_donation', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });
 
        if (response.ok) {
            alert('✅ Donation submitted and saved to Firebase!');
            document.getElementById('donationForm').reset();
            document.getElementById('uploadBox').classList.remove('uploaded');
            document.getElementById('uploadStatus').classList.remove('show');
            document.getElementById('uploadPreview').classList.remove('show');
            uploadedImageUrl = "";
            window.location.href = '/index';
        } else {
            const error = await response.json();
            showError('Submission failed: ' + (error.error || 'Unknown error'));
        }
    } catch (error) {
        console.error('Submit error:', error);
        showError('Failed to submit donation. Please try again.');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '🚚 DEPLOY DONATION';
    }
});
 
function showError(message) {
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.textContent = '⚠️ ' + message;
    errorDiv.classList.add('show');
}
 
function clearError() {
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.classList.remove('show');
    errorDiv.textContent = '';
}
</script>
 
</body> 
</html>
