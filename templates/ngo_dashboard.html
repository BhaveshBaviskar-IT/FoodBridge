
<!DOCTYPE html>
<html>
<head>
<title>NGO Dashboard</title>
</head>
<body>
<h2>Available Food Donations</h2>
<table border="1">
<tr>
<th>Donor</th>
<th>Food</th>
<th>Quantity</th>
<th>Expiry</th>
<th>Status</th>
</tr>
{% for donation in donations %}
<tr>
<td>{{ donation.donor_name }}</td>
<td>{{ donation.food_type }}</td>
<td>{{ donation.quantity }}</td>
<td>{{ donation.expiry }}</td>
<td>{{ donation.status }}</td>
</tr>
{% endfor %}
</table>
</body>
</html>
